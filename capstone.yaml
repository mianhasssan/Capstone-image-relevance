endpoints:
  - path: /images/process-batch
    method: POST
  - path: /images
    method: GET
  - path: /posts
    method: POST
  - path: /posts/{post_id}/images
    method: GET
run: uvicorn main:app --host 127.0.0.1 --port 8000
seed: curl -X POST http://127.0.0.1:8000/images/process-batch
test: pytest test_engine.py
base_url: http://127.0.0.1:8000
